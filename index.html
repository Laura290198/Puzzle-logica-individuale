<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Puzzle dei Confini Colorati</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #FF6B6B;
            --success: #38A169;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --tile-size: 110px;
        }

        @media (max-width: 650px) {
            :root {
                --tile-size: 85px;
            }
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary);
            margin: 5px 0 5px 0;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            color: #4A5568;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1rem;
            max-width: 650px;
            line-height: 1.3;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: white;
            border: 3px solid var(--primary);
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
        }

        .btn:hover, .btn.active {
            background: var(--primary);
            color: white;
        }

        .btn-action {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .btn-action:hover {
            background: var(--secondary);
            color: white;
        }

        .game-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 950px;
            width: 100%;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 290px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #718096;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Griglia di Destinazione senza spazi intermedi per unire perfettamente i pallini */
        .board-grid {
            display: grid;
            gap: 0px;
            background: #2D3748;
            padding: 6px;
            border-radius: 16px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.25);
        }

        .grid-slot {
            width: var(--tile-size);
            height: var(--tile-size);
            background: #EDF2F7;
            border: 2px dashed #CBD5E0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .grid-slot:first-child { border-top-left-radius: 10px; }
        .grid-slot:nth-child(2) { border-top-right-radius: 10px; }

        /* Vassoio Tessere */
        .tray-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 360px;
            justify-content: center;
            align-items: center;
            min-height: calc(var(--tile-size) * 2 + 20px);
            padding: 10px;
            background: #F7FAFC;
            border-radius: 14px;
            border: 2px dashed #CBD5E0;
        }

        /* Tessera del puzzle */
        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background: #FFFFFF;
            border: 2px solid #2D3748;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            overflow: hidden;
            box-sizing: border-box;
        }

        .tray-grid .tile {
            border-radius: 10px;
        }

        .tile:hover {
            transform: scale(1.04);
        }

        .tile.selected {
            border: 4px solid var(--secondary);
            box-shadow: 0 0 0 5px rgba(255, 107, 107, 0.4);
            transform: scale(1.08);
            z-index: 10;
        }

        /* Mezzi pallini sui bordi delle tessere */
        .dot-half {
            position: absolute;
            z-index: 2;
        }

        .dot-top {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 16px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        .dot-bottom {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 16px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .dot-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 32px;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
        }

        .dot-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 32px;
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
        }

        .feedback {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 40px;
            text-align: center;
            padding: 5px 15px;
            border-radius: 10px;
        }

        .correct { 
            color: var(--success); 
            background: #E6FFFA;
            border: 2px solid var(--success);
        }
        
        .wrong { 
            color: var(--secondary); 
            background: #FFF5F5;
            border: 2px solid var(--secondary);
        }
    </style>
</head>
<body>

    <h1>🧩 Il Puzzle dei Confini Colorati</h1>
    <div class="subtitle">
        Tocca una tessera a destra per sceglierla, poi tocca una casella della griglia per posizionarla e unire i pallini dello stesso colore!
    </div>

    <div class="controls">
        <button class="btn active" onclick="changeSize(2)">Griglia 2×2 (Facile)</button>
        <button class="btn" onclick="changeSize(3)">Griglia 3×3 (Medio)</button>
        <button class="btn btn-action" onclick="resetGame()">Nuova Griglia 🔄</button>
    </div>

    <div class="game-layout">
        <!-- Pannello Griglia -->
        <div class="panel">
            <div class="panel-title">1. RICOMPONI LA GRIGLIA QUI</div>
            <div class="board-grid" id="boardGrid"></div>
        </div>

        <!-- Pannello Tessere sparse -->
        <div class="panel">
            <div class="panel-title">2. TESSERE DA INSERIRE</div>
            <div class="tray-grid" id="trayGrid"></div>
        </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <script>
        const COLORS = ['#E53E3E', '#3182CE', '#38A169', '#DD6B20', '#805AD5', '#D69E2E'];
        
        let gridSize = 2;
        let puzzleTiles = [];
        let gridState = []; 
        let selectedTrayIndex = null;

        function changeSize(size) {
            gridSize = size;
            document.querySelectorAll('.controls .btn').forEach((btn, idx) => {
                if (idx < 2) btn.classList.toggle('active', (idx === 0 && size === 2) || (idx === 1 && size === 3));
            });
            resetGame();
        }

        function getRandomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        function resetGame() {
            selectedTrayIndex = null;
            const feedback = document.getElementById('feedback');
            feedback.innerText = '';
            feedback.className = 'feedback';

            // Confini interni verticali e orizzontali
            const vertBorders = Array.from({ length: gridSize }, () => 
                Array.from({ length: gridSize - 1 }, () => getRandomColor())
            );

            const horizBorders = Array.from({ length: gridSize - 1 }, () => 
                Array.from({ length: gridSize }, () => getRandomColor())
            );

            puzzleTiles = [];
            let idCounter = 0;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    puzzleTiles.push({
                        id: idCounter++,
                        top: r > 0 ? horizBorders[r - 1][c] : null,
                        bottom: r < gridSize - 1 ? horizBorders[r][c] : null,
                        left: c > 0 ? vertBorders[r][c - 1] : null,
                        right: c < gridSize - 1 ? vertBorders[r][c] : null
                    });
                }
            }

            gridState = Array.from({ length: gridSize }, () => Array(gridSize).fill(null));

            shuffleArray(puzzleTiles);

            renderBoard();
            renderTray();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createTileDOM(tile) {
            if (!tile) return null;
            
            const tileDiv = document.createElement('div');
            tileDiv.className = 'tile';

            if (tile.top) {
                const dot = document.createElement('div');
                dot.className = 'dot-half dot-top';
                dot.style.backgroundColor = tile.top;
                tileDiv.appendChild(dot);
            }
            if (tile.bottom) {
                const dot = document.createElement('div');
                dot.className = 'dot-half dot-bottom';
                dot.style.backgroundColor = tile.bottom;
                tileDiv.appendChild(dot);
            }
            if (tile.left) {
                const dot = document.createElement('div');
                dot.className = 'dot-half dot-left';
                dot.style.backgroundColor = tile.left;
                tileDiv.appendChild(dot);
            }
            if (tile.right) {
                const dot = document.createElement('div');
                dot.className = 'dot-half dot-right';
                dot.style.backgroundColor = tile.right;
                tileDiv.appendChild(dot);
            }

            return tileDiv;
        }

        function renderBoard() {
            const board = document.getElementById('boardGrid');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gridSize}, var(--tile-size))`;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const slot = document.createElement('div');
                    slot.className = 'grid-slot';
                    slot.dataset.row = r;
                    slot.dataset.col = c;

                    const placedTile = gridState[r][c];
                    if (placedTile) {
                        const tileElement = createTileDOM(placedTile);
                        slot.appendChild(tileElement);
                    }

                    slot.onclick = () => handleSlotClick(r, c);
                    board.appendChild(slot);
                }
            }
        }

        function renderTray() {
            const tray = document.getElementById('trayGrid');
            tray.innerHTML = '';

            puzzleTiles.forEach((tile, index) => {
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';

                const tileElement = createTileDOM(tile);
                if (selectedTrayIndex === index) {
                    tileElement.classList.add('selected');
                }

                tileElement.onclick = () => selectTrayTile(index);
                wrapper.appendChild(tileElement);
                tray.appendChild(wrapper);
            });
        }

        function selectTrayTile(index) {
            if (selectedTrayIndex === index) {
                selectedTrayIndex = null;
            } else {
                selectedTrayIndex = index;
            }
            renderTray();
        }

        function handleSlotClick(r, c) {
            // Se lo slot ha già una tessera, la rimette nel vassoio
            if (gridState[r][c]) {
                puzzleTiles.push(gridState[r][c]);
                gridState[r][c] = null;
                selectedTrayIndex = null;
                renderBoard();
                renderTray();
                checkSolution();
                return;
            }

            // Se è selezionata una tessera dal vassoio, la sposta nella griglia
            if (selectedTrayIndex !== null && puzzleTiles[selectedTrayIndex]) {
                const tileToPlace = puzzleTiles.splice(selectedTrayIndex, 1)[0];
                gridState[r][c] = tileToPlace;
                selectedTrayIndex = null;
                renderBoard();
                renderTray();
                checkSolution();
            }
        }

        function checkSolution() {
            const feedback = document.getElementById('feedback');

            // Verifica se tutte le caselle sono occupate
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (!gridState[r][c]) {
                        feedback.innerText = '';
                        feedback.className = 'feedback';
                        return;
                    }
                }
            }

            // Controlla i confini orizzontali (destra - sinistra)
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize - 1; c++) {
                    const leftTile = gridState[r][c];
                    const rightTile = gridState[r][c + 1];
                    if (leftTile.right !== rightTile.left) {
                        showError("I pallini sui confini non combaciano! Sposta qualche tessera per correggere. 🧐");
                        return;
                    }
                }
            }

            // Controlla i confini verticali (basso - alto)
            for (let r = 0; r < gridSize - 1; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const topTile = gridState[r][c];
                    const bottomTile = gridState[r + 1][c];
                    if (topTile.bottom !== bottomTile.top) {
                        showError("I pallini sui confini non combaciano! Sposta qualche tessera per correggere. 🧐");
                        return;
                    }
                }
            }

            feedback.innerText = "Bravissimo! Tutti i pallini combaciano perfettamente! 🎉👏";
            feedback.className = "feedback correct";
            playSuccessSound();
        }

        function showError(msg) {
            const feedback = document.getElementById('feedback');
            feedback.innerText = msg;
            feedback.className = "feedback wrong";
        }

        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.1 + 0.3);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                });
            } catch(e) {}
        }

        resetGame();
    </script>
</body>
</html>
